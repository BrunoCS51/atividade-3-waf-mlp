version: '3.8'
services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/bloqueio.html:/usr/share/nginx/html/bloqueio.html
      - ./php:/var/www/html
    depends_on:
      - python_waf
      - php_app
      - dashboard

  php_app:
    image: php:8.0-fpm
    volumes:
      - ./php:/var/www/html

  python_waf:
    build: ./python
    ports:
      - "5000:5000"
    volumes:
      - ./python:/app

  dashboard:
    image: python:3.9-slim
    working_dir: /dashboard
    command: ["python", "server.py"]
    volumes:
      - ./dashboard:/dashboard:ro
      - ./python:/data:ro
      - ./external_data/csic2010:/external_data/csic2010:ro
