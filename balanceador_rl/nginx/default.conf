server {
    listen 8080;
    server_name _;

    location = /health {
        return 200 "rl-proxy-ok\n";
        add_header Content-Type text/plain;
    }

    location /node1 {
        proxy_pass http://rl_node1:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Network-State $http_x_network_state;
        add_header X-Upstream-Node "node1 (1.00 CPU)" always;
    }

    location /node2 {
        proxy_pass http://rl_node2:80/?wait=140ms;
        proxy_set_header Host $host;
        proxy_set_header X-Network-State $http_x_network_state;
        add_header X-Upstream-Node "node2 (0.25 CPU)" always;
    }

    location /node3 {
        proxy_pass http://rl_node3:80/?wait=620ms;
        proxy_read_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Network-State $http_x_network_state;
        add_header X-Upstream-Node "node3 (0.05 CPU)" always;
    }

    # Rotas da simulação interativa: o atraso é definido pelo agente a partir
    # da carga escolhida pelo usuário, mas a resposta continua vindo do nó real.
    location /simulation/node1 {
        proxy_pass http://rl_node1:80/?wait=$arg_wait;
        proxy_set_header Host $host;
        add_header X-Upstream-Node "node1 interactive" always;
    }

    location /simulation/node2 {
        proxy_pass http://rl_node2:80/?wait=$arg_wait;
        proxy_set_header Host $host;
        add_header X-Upstream-Node "node2 interactive" always;
    }

    location /simulation/node3 {
        proxy_pass http://rl_node3:80/?wait=$arg_wait;
        proxy_read_timeout 2s;
        proxy_set_header Host $host;
        add_header X-Upstream-Node "node3 interactive" always;
    }
}
